server:
  port: 8081
  servelet:
    context-path: /api/v1


spring:
  application:
    name: helpdesk
  flyway:
    enable: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postegresql://localhost:5432/helpdesk
    username: postgres
    password: postgres
